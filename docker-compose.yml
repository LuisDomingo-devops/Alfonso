version: '3.8'

services:
  alfonso:
    build: .
    ports:
      - "7860:7860"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - MODEL_NAME=deepseek-r1:1.5b
      - LLM_IS_REASONING=true
      - LLM_NUM_CTX_CHAT=4096
      - LLM_NUM_CTX_TOOL=4096
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
