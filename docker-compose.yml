version: '3.8'

services:
  alfonso:
    build: .
    ports:
      - "7860:7860"
    environment:
      - OLLAMA_BASE_URL=http://localhost:11434
      - MODEL_NAME=qwen2.5:1.5b
      - LLM_IS_REASONING=false
      - LLM_NUM_CTX_CHAT=2048
      - LLM_NUM_CTX_TOOL=1024
    volumes:
      - ollama_storage:/home/user/.ollama
      - alfonso_data:/home/user/app/data
      - alfonso_logs:/home/user/app/logs
    restart: unless-stopped

volumes:
  ollama_storage:
  alfonso_data:
  alfonso_logs:
